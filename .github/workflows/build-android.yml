name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stitch-counter-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Controller support
        run: |
          cat > android/app/src/main/java/com/stitchcounter/app/MainActivity.java <<'EOF'
          package com.stitchcounter.app;

          import android.view.InputDevice;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private int hatX = 0;
              private int hatY = 0;

              private void send(String name, boolean down, String raw) {
                  if (bridge == null) return;
                  final WebView wv = bridge.getWebView();
                  if (wv == null) return;
                  final String js = "window.nativePad && window.nativePad('" + name + "'," + down + ",'" + raw + "')";
                  wv.post(() -> wv.evaluateJavascript(js, null));
              }

              private String keyName(int code) {
                  switch (code) {
                      case KeyEvent.KEYCODE_DPAD_UP: return "up";
                      case KeyEvent.KEYCODE_DPAD_DOWN: return "down";
                      case KeyEvent.KEYCODE_DPAD_LEFT: return "left";
                      case KeyEvent.KEYCODE_DPAD_RIGHT: return "right";
                      case KeyEvent.KEYCODE_BUTTON_A: return "cross";
                      case KeyEvent.KEYCODE_BUTTON_B: return "circle";
                      case KeyEvent.KEYCODE_BUTTON_X: return "square";
                      case KeyEvent.KEYCODE_BUTTON_Y: return "triangle";
                      case KeyEvent.KEYCODE_BUTTON_L1: return "l1";
                      case KeyEvent.KEYCODE_BUTTON_R1: return "r1";
                      case KeyEvent.KEYCODE_BUTTON_L2: return "l2";
                      case KeyEvent.KEYCODE_BUTTON_R2: return "r2";
                      case KeyEvent.KEYCODE_BUTTON_SELECT: return "share";
                      case KeyEvent.KEYCODE_BUTTON_START: return "options";
                      case KeyEvent.KEYCODE_BUTTON_THUMBL: return "l3";
                      case KeyEvent.KEYCODE_BUTTON_THUMBR: return "r3";
                      case KeyEvent.KEYCODE_BUTTON_MODE: return "ps";
                      default: return null;
                  }
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  int code = event.getKeyCode();
                  String name = keyName(code);
                  if (name == null && KeyEvent.isGamepadButton(code)) name = "key" + code;
                  if (name != null) {
                      String raw = KeyEvent.keyCodeToString(code).replace("KEYCODE_", "");
                      if (event.getRepeatCount() == 0) {
                          if (event.getAction() == KeyEvent.ACTION_DOWN) send(name, true, raw);
                          else if (event.getAction() == KeyEvent.ACTION_UP) send(name, false, raw);
                      }
                      return true;
                  }
                  return super.dispatchKeyEvent(event);
              }

              @Override
              public boolean dispatchGenericMotionEvent(MotionEvent event) {
                  if ((event.getSource() & InputDevice.SOURCE_CLASS_JOYSTICK) != 0
                          && event.getAction() == MotionEvent.ACTION_MOVE) {
                      int x = Math.round(event.getAxisValue(MotionEvent.AXIS_HAT_X));
                      int y = Math.round(event.getAxisValue(MotionEvent.AXIS_HAT_Y));
                      if (x != hatX) {
                          if (hatX == -1) send("left", false, "HAT_LEFT");
                          if (hatX == 1) send("right", false, "HAT_RIGHT");
                          if (x == -1) send("left", true, "HAT_LEFT");
                          if (x == 1) send("right", true, "HAT_RIGHT");
                          hatX = x;
                      }
                      if (y != hatY) {
                          if (hatY == -1) send("up", false, "HAT_UP");
                          if (hatY == 1) send("down", false, "HAT_DOWN");
                          if (y == -1) send("up", true, "HAT_UP");
                          if (y == 1) send("down", true, "HAT_DOWN");
                          hatY = y;
                      }
                      return true;
                  }
                  return super.dispatchGenericMotionEvent(event);
              }
          }
          EOF
          cat > www/native-pad.js <<'EOF'
          (function () {
            var IDX = {cross:0, circle:1, square:2, triangle:3, l1:4, r1:5, l2:6, r2:7,
                       share:8, options:9, l3:10, r3:11, up:12, down:13, left:14, right:15, ps:16};
            var next = 17;
            var buttons = [];
            function ensure(n) { while (buttons.length <= n) buttons.push({pressed:false, touched:false, value:0}); }
            ensure(16);
            window.padButtonNames = {};
            window.padRawNames = {};
            var pad = {id:"Controller", index:0, connected:true, mapping:"standard",
                       axes:[0,0,0,0], buttons:buttons, timestamp:0};
            var active = false;
            function useNative() {
              if (active) return;
              active = true;
              var fn = function () { return [pad]; };
              try { Object.defineProperty(navigator, "getGamepads", {configurable:true, value:fn}); }
              catch (e) { navigator.getGamepads = fn; }
            }
            window.nativePad = function (name, down, raw) {
              var i = IDX[name];
              if (i === undefined) {
                i = next++; IDX[name] = i; ensure(i);
                window.padButtonNames[i] = "Button " + (raw || name);
              }
              if (raw) window.padRawNames[i] = raw;
              useNative();
              pad.timestamp = performance.now();
              if (down) { buttons[i].pressed = true; buttons[i].value = 1; }
              else setTimeout(function () { buttons[i].pressed = false; buttons[i].value = 0; }, 50);
            };
          })();
          EOF
          sed -i '0,/<script>/s//<script src="native-pad.js"><\/script>\n<script>/' www/index.html
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: App icon
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Copy app files
        run: npx cap sync android

      - name: Build app file
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save app file
        uses: actions/upload-artifact@v4
        with:
          name: stitch-counter-app
          path: stitch-counter-app/android/app/build/outputs/apk/debug/app-debug.apk
