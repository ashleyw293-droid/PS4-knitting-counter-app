<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stitch Counter</title>
<style>
:root{
  --bg:#E6EAEE; --surface:#F6F8FA; --ink:#1D2733; --muted:#5E6B78; --line:#C9D1D9;
  --knit:#4F8A62; --purl:#4468A3; --increase:#B07D12; --decrease:#9A4468;
  --row:var(--knit);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151B22; --surface:#1E2630; --ink:#E9EEF3; --muted:#9AA7B4; --line:#33404D;
    --knit:#7DBE91; --purl:#86A7DE; --increase:#E0B04A; --decrease:#D987A9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151B22; --surface:#1E2630; --ink:#E9EEF3; --muted:#9AA7B4; --line:#33404D;
  --knit:#7DBE91; --purl:#86A7DE; --increase:#E0B04A; --decrease:#D987A9;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent}
main{max-width:34rem; margin:0 auto; padding:1rem 1rem 2.5rem}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--row); outline-offset:2px}

.topbar{display:flex; justify-content:space-between; align-items:center; gap:.75rem; margin-bottom:.75rem}
h1{font-size:1.15rem; font-weight:800; margin:0; letter-spacing:-.01em}
.pad{display:flex; align-items:center; gap:.45rem; font-size:.85rem; color:var(--muted)}
.dot{width:.6rem; height:.6rem; border-radius:50%; background:var(--line); flex:none}
.pad.on .dot{background:var(--knit)}
.pad.on{color:var(--ink)}

.counter{background:var(--surface); border-radius:1.5rem; padding:1.25rem 1.25rem 1rem;
  border:2px solid var(--row); transition:border-color .2s}
.rowline{display:flex; justify-content:space-between; align-items:baseline; font-size:.95rem; color:var(--muted)}
.rowline strong{color:var(--row); font-weight:800; font-size:1.05rem}
.big{font-size:clamp(5.5rem,30vw,9.5rem); font-weight:800; line-height:.95; text-align:center;
  margin:.4rem 0 .2rem; font-variant-numeric:tabular-nums; letter-spacing:-.04em}
.big.bump{animation:bump .18s ease-out}
@keyframes bump{from{transform:scale(1.06)}to{transform:scale(1)}}
.unit{text-align:center; color:var(--muted); font-size:.95rem; margin-bottom:.75rem}

/* One V per finished row, colored by row type */
.chain{display:flex; flex-wrap:wrap; gap:1px 0; justify-content:center; min-height:1.25rem; margin-bottom:1rem}
.chain svg{width:14px; height:18px; display:block}
.chain path{fill:none; stroke-width:2.4; stroke-linecap:round}
.chain .more{font-size:.8rem; color:var(--muted); align-self:center; margin-right:.35rem}

.steps{display:grid; grid-template-columns:1fr 1fr; gap:.6rem}
.stepbtn{border:0; border-radius:1rem; padding:1rem .5rem; font-size:1.3rem; font-weight:800;
  background:var(--bg); display:flex; align-items:center; justify-content:center; gap:.4rem}
.stepbtn:active{background:var(--line)}

section{margin-top:1.25rem}
h2{font-size:.95rem; font-weight:600; margin:0 0 .5rem; color:var(--muted)}
.seg{display:flex; flex-wrap:wrap; gap:.4rem}
.seg button{border:1.5px solid var(--line); background:var(--surface); border-radius:999px;
  padding:.45rem .9rem; min-width:2.75rem}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.types button[data-type="knit"][aria-pressed="true"]{background:var(--knit); border-color:var(--knit); color:#fff}
.types button[data-type="purl"][aria-pressed="true"]{background:var(--purl); border-color:var(--purl); color:#fff}
.types button[data-type="increase"][aria-pressed="true"]{background:var(--increase); border-color:var(--increase); color:#fff}
.types button[data-type="decrease"][aria-pressed="true"]{background:var(--decrease); border-color:var(--decrease); color:#fff}
.seg input{width:4.5rem; border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:999px; padding:.45rem .75rem; font:inherit}

.actions{margin-top:1.25rem}
.secondary{width:100%; border:1.5px solid var(--line); background:var(--surface); border-radius:1rem; padding:.8rem}
.secondary:disabled{opacity:.45; cursor:default}

.toggles{display:flex; flex-direction:column; gap:.55rem}
.toggles label{display:flex; align-items:center; gap:.6rem}
.toggles input{width:1.15rem; height:1.15rem; accent-color:var(--row)}

.summary{margin:0 0 .6rem; font-size:.92rem}
.history{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.history li{display:grid; grid-template-columns:4.5rem 1fr; gap:.5rem; padding:.5rem 0; border-bottom:1px solid var(--line)}
.history .tag{font-weight:600}
.history .n{font-variant-numeric:tabular-nums; color:var(--muted)}
.empty{color:var(--muted); font-size:.92rem; margin:0}

.map{width:100%; border-collapse:collapse; font-size:.92rem}
.map td{padding:.35rem 0; border-bottom:1px solid var(--line)}
.map td:first-child{color:var(--muted); width:40%}
.map td:last-child{text-align:right; width:6.5rem}
.map .bind{font-weight:600}
.change{border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:.3rem .8rem; font-size:.88rem}
.change.listening{background:var(--row); border-color:var(--row); color:#fff}
.hint{font-size:.85rem; color:var(--muted); margin:.6rem 0 0}
.reset{margin-top:1.5rem; background:none; border:0; color:var(--decrease); text-decoration:underline; padding:.25rem 0}

@media (prefers-reduced-motion:reduce){.big.bump{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <h1>Stitch Counter</h1>
    <div class="pad" id="pad" role="status" aria-live="polite"><span class="dot"></span><span id="padText">No controller</span></div>
  </div>

  <div class="counter">
    <div class="rowline"><span>Up next</span><strong id="rowType">Knit row</strong></div>
    <div class="big" id="count" aria-live="polite">0</div>
    <div class="unit" id="unit">rows</div>
    <div class="chain" id="chain" aria-hidden="true"></div>
    <div class="steps">
      <button class="stepbtn" id="minus">− <span id="minusN">1</span></button>
      <button class="stepbtn" id="plus">+ <span id="plusN">1</span></button>
    </div>
  </div>

  <section>
    <h2>Next row type</h2>
    <div class="seg types" id="types">
      <button data-type="knit">Knit</button>
      <button data-type="purl">Purl</button>
      <button data-type="increase">Increase</button>
      <button data-type="decrease">Decrease</button>
    </div>
  </section>

  <div class="actions"><button class="secondary" id="undo" disabled>Undo last change</button></div>

  <section>
    <h2>Count rows by</h2>
    <div class="seg" id="stepSeg">
      <button data-step="1">1</button>
      <button data-step="2">2</button>
      <button data-step="3">3</button>
      <button data-step="4">4</button>
      <input id="customStep" type="number" min="1" max="99" inputmode="numeric" placeholder="Other" aria-label="Custom step">
    </div>
  </section>

  <section>
    <h2>Options</h2>
    <div class="toggles">
      <label><input type="checkbox" id="optAlt"> Switch between knit and purl after each row</label>
      <label><input type="checkbox" id="optWake"> Keep screen on</label>
    </div>
  </section>

  <section>
    <h2>Controller buttons</h2>
    <table class="map" id="mapTable"></table>
    <p class="hint" id="padHint">Press any button on the controller to connect it. If nothing happens, close and reopen the app, then try again.</p>
    <p class="hint" id="lastInput">Last button pressed: none yet</p>
    <button class="reset" id="resetMap" style="margin-top:.5rem">Go back to the default buttons</button>
  </section>

  <section>
    <h2>Rows so far</h2>
    <p class="summary" id="summary"></p>
    <p class="empty" id="emptyHist">Rows you count show up here.</p>
    <ul class="history" id="history"></ul>
  </section>

  <button class="reset" id="resetAll">Clear all rows and start over</button>
</main>

<script>
(function(){
  const TYPES = ["knit","purl","increase","decrease"];
  const LABEL = {knit:"Knit",purl:"Purl",increase:"Increase",decrease:"Decrease"};
  const KEY = "stitch-counter-rows-v1";
  const defaults = {step:1, type:"knit", alternate:false, history:[]};
  const $ = id => document.getElementById(id);

  let state = load();
  const undoStack = [];

  function load(){
    try{ const raw = localStorage.getItem(KEY); if(raw) return Object.assign({}, defaults, JSON.parse(raw)); }catch(e){}
    return Object.assign({}, defaults, {history:[]});
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function snapshot(){ undoStack.push(JSON.stringify(state)); if(undoStack.length > 100) undoStack.shift(); }

  function render(bump){
    const rows = state.history.length;
    document.documentElement.style.setProperty("--row", `var(--${state.type})`);
    const countEl = $("count");
    countEl.textContent = rows;
    if(bump){ countEl.classList.remove("bump"); void countEl.offsetWidth; countEl.classList.add("bump"); }
    $("unit").textContent = rows === 1 ? "row" : "rows";
    $("rowType").textContent = LABEL[state.type] + " row";
    $("plusN").textContent = state.step === 1 ? "1 row" : state.step + " rows";
    $("minusN").textContent = state.step === 1 ? "1 row" : state.step + " rows";
    $("undo").disabled = undoStack.length === 0;

    document.querySelectorAll("#types button").forEach(b => b.setAttribute("aria-pressed", b.dataset.type === state.type));
    let preset = false;
    document.querySelectorAll("#stepSeg button").forEach(b => {
      const on = Number(b.dataset.step) === state.step; if(on) preset = true;
      b.setAttribute("aria-pressed", on);
    });
    const custom = $("customStep");
    if(document.activeElement !== custom) custom.value = preset ? "" : state.step;
    $("optAlt").checked = state.alternate;

    // Recent rows as colored stitches, newest last
    const recent = state.history.slice(-60);
    let html = rows > 60 ? `<span class="more">+${rows - 60}</span>` : "";
    for(const h of recent) html += `<svg viewBox="0 0 14 18"><path style="stroke:var(--${h.type})" d="M2 3 L7 15 L12 3"/></svg>`;
    $("chain").innerHTML = html;

    const totals = {knit:0,purl:0,increase:0,decrease:0};
    state.history.forEach(h => totals[h.type]++);
    $("summary").textContent = rows ? TYPES.filter(t => totals[t]).map(t => `${LABEL[t]}: ${totals[t]}`).join(", ") : "";
    $("emptyHist").style.display = rows ? "none" : "";
    $("history").innerHTML = state.history.slice(-40).reverse().map(h =>
      `<li><span class="n">Row ${h.row}</span><span class="tag" style="color:var(--${h.type})">${LABEL[h.type]}</span></li>`).join("");
  }

  // Actions
  function addRows(){
    snapshot();
    for(let i = 0; i < state.step; i++){
      state.history.push({row: state.history.length + 1, type: state.type});
      if(state.alternate){
        if(state.type === "knit") state.type = "purl";
        else if(state.type === "purl") state.type = "knit";
      }
    }
    save(); render(true); rumble();
  }
  function removeRows(){
    if(!state.history.length) return;
    snapshot();
    let removed = null;
    for(let i = 0; i < state.step && state.history.length; i++) removed = state.history.pop();
    if(removed) state.type = removed.type; // you're back on that row, so it's up next again
    save(); render(true);
  }
  function setType(t){ if(t === state.type) return; snapshot(); state.type = t; save(); render(); }
  function undo(){ if(!undoStack.length) return; state = JSON.parse(undoStack.pop()); save(); render(true); }
  function setStep(n){ n = Math.round(Number(n)); if(!n || n < 1) return; state.step = Math.min(99, n); save(); render(); }

  $("plus").onclick = addRows;
  $("minus").onclick = removeRows;
  $("undo").onclick = undo;
  document.querySelectorAll("#types button").forEach(b => b.onclick = () => setType(b.dataset.type));
  document.querySelectorAll("#stepSeg button").forEach(b => b.onclick = () => setStep(b.dataset.step));
  $("customStep").addEventListener("change", e => setStep(e.target.value));
  $("optAlt").onchange = e => { state.alternate = e.target.checked; save(); };
  $("resetAll").onclick = () => {
    if(!confirm("Clear all counted rows?")) return;
    snapshot();
    state = Object.assign({}, defaults, {history:[], step:state.step, alternate:state.alternate});
    save(); render(true);
  };

  // Keep screen on
  let wakeLock = null;
  async function requestWake(){ try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){ wakeLock = null; } }
  $("optWake").onchange = async e => {
    if(e.target.checked){
      await requestWake();
      if(!wakeLock){ e.target.checked = false; alert("This phone won't let the app keep the screen on. Try a longer screen timeout in your phone settings."); }
    } else if(wakeLock){ wakeLock.release(); wakeLock = null; }
  };
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && $("optWake").checked) requestWake(); });

  // ----- Controller -----
  let padSeen = false, activePad = null;
  const prev = {};
  function rumble(){
    try{ if(activePad && activePad.vibrationActuator)
      activePad.vibrationActuator.playEffect("dual-rumble",{duration:100, strongMagnitude:.5, weakMagnitude:.3}); }catch(e){}
  }

  const ACTIONS = [
    {id:"rowUp",    label:"Add a row",       def:"D-pad up or R2",   idx:[12,7]},
    {id:"rowDown",  label:"Take away a row", def:"D-pad down or L2", idx:[13,6]},
    {id:"knit",     label:"Knit row",        def:"Square (□)",       idx:[2]},
    {id:"purl",     label:"Purl row",        def:"Cross (✕)",        idx:[0]},
    {id:"increase", label:"Increase row",    def:"Triangle (△)",     idx:[3]},
    {id:"decrease", label:"Decrease row",    def:"Circle (○)",       idx:[1]}
  ];
  const RUN = {rowUp:addRows, rowDown:removeRows, knit:()=>setType("knit"), purl:()=>setType("purl"),
               increase:()=>setType("increase"), decrease:()=>setType("decrease")};
  const BTN_NAMES = ["Cross (✕)","Circle (○)","Square (□)","Triangle (△)","L1","R1","L2","R2","Share","Options","L3 (left stick click)","R3 (right stick click)","D-pad up","D-pad down","D-pad left","D-pad right","PS button","Touchpad"];
  const MAP_KEY = "stitch-counter-buttons-v2";
  let bindings = {};
  try{ bindings = JSON.parse(localStorage.getItem(MAP_KEY)) || {}; }catch(e){ bindings = {}; }
  function saveBindings(){ try{ localStorage.setItem(MAP_KEY, JSON.stringify(bindings)); }catch(e){} }

  function describe(bind){
    if(!bind) return null;
    if(bind.btn !== undefined) return BTN_NAMES[bind.btn] || `Button ${bind.btn}`;
    if(bind.dir !== undefined) return `Stick/axis ${bind.axis} ${bind.dir > 0 ? "+" : "−"}`;
    return `Axis ${bind.axis} (${bind.value.toFixed(2)})`;
  }
  function bindPressed(gp, bind){
    if(bind.btn !== undefined) return !!(gp.buttons[bind.btn] && gp.buttons[bind.btn].pressed);
    const v = gp.axes[bind.axis];
    if(v === undefined) return false;
    if(bind.dir !== undefined) return Math.sign(v) === bind.dir && Math.abs(v) > 0.5;
    return Math.abs(v - bind.value) < 0.1;
  }

  let listeningFor = null, listenBaseline = null, listenTimer = null;
  function renderMap(){
    $("mapTable").innerHTML = ACTIONS.map(a => {
      const listening = listeningFor === a.id;
      return `<tr><td>${a.label}</td><td class="bind">${listening ? "Press a button…" : (describe(bindings[a.id]) || a.def)}</td>` +
        `<td><button class="change${listening ? " listening" : ""}" data-action="${a.id}">${listening ? "Cancel" : "Change"}</button></td></tr>`;
    }).join("");
    document.querySelectorAll(".change").forEach(b => b.onclick = () => {
      if(listeningFor === b.dataset.action) stopListening(); else startListening(b.dataset.action);
    });
  }
  function startListening(id){
    if(!padSeen){ alert("Connect the controller first by pressing any button on it."); return; }
    listeningFor = id; listenBaseline = null;
    clearTimeout(listenTimer); listenTimer = setTimeout(stopListening, 10000);
    renderMap();
  }
  function stopListening(){ listeningFor = null; listenBaseline = null; clearTimeout(listenTimer); renderMap(); }
  function captureBinding(gp){
    if(!listenBaseline){ if(gp.buttons.some(b => b.pressed)) return; listenBaseline = gp.axes.slice(); return; }
    const i = gp.buttons.findIndex(b => b.pressed);
    let bind = null;
    if(i >= 0) bind = {btn:i};
    else for(let a = 0; a < gp.axes.length; a++){
      const v = gp.axes[a], base = listenBaseline[a];
      if(Math.abs(v) <= 1 && Math.abs(v - base) > 0.5){ bind = Math.abs(base) < 0.2 ? {axis:a, dir:Math.sign(v)} : {axis:a, value:v}; break; }
    }
    if(!bind) return;
    bindings[listeningFor] = bind; saveBindings(); stopListening();
    Object.assign(prev, readButtons(gp));
  }
  $("resetMap").onclick = () => { bindings = {}; saveBindings(); stopListening(); };
  renderMap();

  function readDefaults(gp){
    const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const r = {};
    for(const a of ACTIONS) r[a.id] = a.idx.some(b);
    // D-pad reported as axes on some non-standard setups
    const ax = gp.axes || [];
    if(gp.mapping !== "standard"){
      if(ax.length >= 8){ if(ax[7] < -0.5) r.rowUp = true; if(ax[7] > 0.5) r.rowDown = true; }
      if(ax.length >= 10 && Math.abs(ax[9]) <= 1){
        const h = ax[9];
        if(Math.abs(h + 1) < 0.1 || Math.abs(h - 1) < 0.1) r.rowUp = true;
        if(Math.abs(h - 0.14) < 0.1) r.rowDown = true;
      }
    }
    return r;
  }
  function readButtons(gp){
    const r = readDefaults(gp);
    for(const a of ACTIONS) if(bindings[a.id]) r[a.id] = bindPressed(gp, bindings[a.id]);
    return r;
  }

  let lastShown = -1;
  function showLastInput(gp){
    const i = gp.buttons.findIndex(b => b.pressed);
    if(i >= 0 && i !== lastShown) $("lastInput").textContent = `Last button pressed: ${BTN_NAMES[i] || "Button " + i}`;
    lastShown = i;
  }

  function poll(){
    let pads = [];
    try{ pads = navigator.getGamepads ? navigator.getGamepads() : []; }
    catch(e){
      // This screen isn't allowed to use controllers (e.g. a preview window)
      $("padText").textContent = "Controller blocked here";
      $("padHint").textContent = "This window can't use a controller. Open the Stitch Counter app on your phone instead.";
      return;
    }
    let gp = null;
    for(const p of pads){ if(p && p.connected){ gp = p; break; } }
    activePad = gp;
    if(!!gp !== padSeen){
      padSeen = !!gp;
      $("pad").classList.toggle("on", padSeen);
      $("padText").textContent = padSeen ? "Controller connected" : "No controller";
      $("padHint").style.display = padSeen ? "none" : "";
    }
    if(gp){
      showLastInput(gp);
      if(listeningFor){ captureBinding(gp); }
      else {
        const now = readButtons(gp);
        for(const a of ACTIONS) if(now[a.id] && !prev[a.id]) RUN[a.id]();
        Object.assign(prev, now);
      }
    }
    requestAnimationFrame(poll);
  }
  requestAnimationFrame(poll);

  // Tapped buttons shouldn't keep focus (a controller press could "click" them)
  document.addEventListener("click", e => { const b = e.target.closest && e.target.closest("button"); if(b) setTimeout(() => b.blur(), 0); });
  // Arrow-key fallback when no controller is detected
  document.addEventListener("keydown", e => {
    if(e.target && e.target.tagName === "INPUT") return;
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter"," "].includes(e.key)) e.preventDefault();
    if(padSeen) return;
    if(e.key === "ArrowUp") addRows();
    if(e.key === "ArrowDown") removeRows();
  });

  render();
})();
</script>
</body>
</html>
